name: GitHub Metrics

on:
  # Regenerate weekly so the card stays current
  schedule:
    - cron: "0 6 * * 0"   # 06:00 UTC every sunday
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Regenerate on pushes to the default branch
  push:
    branches: [ main ]

permissions:
  contents: write   # needed so the action can commit the SVG back

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics card
        uses: lowlighter/metrics@latest
        with:
          # A Personal Access Token you create and store as a repo secret.
          # See setup notes for the exact scopes.
          # The PAT expires: "Bad credentials" in the logs means it needs renewing
          # (that is what failed the 2026-11-01 and 2026-11-08 runs).
          token: ${{ secrets.METRICS_TOKEN }}

          user: cheneeheng
          filename: github-metrics.svg
          template: classic
          config_timezone: Europe/Berlin

          # Top header: avatar, name, follower/star/commit counts, activity calendar
          base: header

          # Isometric commit calendar for the full year, with streak stats
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Most-used languages bar. The recently-used section is left out: in v3.34
          # it crashes on push events that no longer carry commit details.
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # Not usable on v3.34 (both render "Unexpected error"):
          # - habits: crashes on push events that no longer carry commit details
          # - achievements: queries Projects (classic), which GitHub has sunset

          # Latest blog posts
          plugin_rss: yes
          plugin_rss_source: https://cheneeheng.github.io/rss.xml
          plugin_rss_limit: 3

          # Commit the generated SVG to the default branch
          output_action: commit
          committer_branch: main
